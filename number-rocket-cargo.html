<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4eb">
  <title>Rocket Cargo | Yuaan’s Playroom</title>
  <style>
    :root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f7f4eb;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;--gold:#f3e4bb;--line:#e6e0cf;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}
    .page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}
    header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}.brand{color:var(--muted);font-size:.88rem;font-weight:800}
    main{flex:1;display:grid;align-content:center;padding:22px 0 48px}.panel{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 12px 30px rgba(42,60,65,.05)}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{margin:0;color:var(--green-ink);font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.step{color:var(--muted);font-size:.85rem;font-weight:800}h1{margin:7px 0 0;font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.05em}.instruction{margin:7px 0 18px;color:var(--muted);font-size:.97rem;line-height:1.45}
    .sky{position:relative;min-height:144px;display:flex;align-items:center;justify-content:center;gap:clamp(24px,8vw,65px);overflow:hidden;border:1px solid #dce8e5;border-radius:19px;background:linear-gradient(#e8f1ef 0 73%,#dce8d6 73%)}.stars{position:absolute;inset:10px;color:#bba968;letter-spacing:1.3rem;font-size:1rem;opacity:.75;pointer-events:none}.rocket{z-index:1;font-size:4.3rem;line-height:1;transition:transform .5s ease}.rocket.launch{transform:translate(80px,-130px) rotate(24deg);opacity:.15}.cargo{z-index:1;width:min(50%,190px);min-height:92px;display:grid;grid-template-columns:repeat(5,1fr);align-content:center;justify-items:center;gap:3px;padding:8px;border:2px dashed #b9cbbc;border-radius:18px;background:rgba(255,254,250,.8)}.cargo-item{font-size:1.65rem;line-height:1.2;animation:load .2s ease-out}@keyframes load{from{transform:translateY(-14px) scale(.7);opacity:0}to{transform:none;opacity:1}}
    .target{margin:17px 0 4px;color:#806a36;font-size:clamp(3.2rem,14vw,5rem);font-weight:950;line-height:1;text-align:center;font-variant-numeric:tabular-nums}.target-label{margin:0;color:var(--muted);font-weight:800;text-align:center}.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:16px}.load-button{width:66px;height:66px;border:2px solid #cbdcc9;border-radius:20px;background:#eff6e9;color:var(--ink);font-size:2.1rem;cursor:pointer;touch-action:manipulation}.load-button:active{transform:scale(.94)}.load-button:disabled{opacity:.5;cursor:default}.loaded{min-width:78px;color:var(--green-ink);font-size:1.2rem;font-weight:900;text-align:center}.feedback{min-height:48px;display:flex;align-items:center;justify-content:center;margin:9px 0 0;color:var(--muted);font-weight:800;text-align:center}.feedback.good{color:var(--green-ink)}.actions{display:flex;justify-content:center;gap:9px;margin-top:5px}.action{min-height:43px;padding:0 14px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}.load-button:focus-visible,.action:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}
    @media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:17px 12px;border-radius:21px}.sky{min-height:132px}.rocket{font-size:3.7rem}.cargo{min-height:82px}.cargo-item{font-size:1.4rem}.load-button{width:60px;height:60px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
<script src="speech.js?v=1"></script>
</head>
<body>
  <div class="page">
    <header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header>
    <main><section class="panel" aria-labelledby="title">
      <div class="topline"><p class="eyebrow">Count and load</p><span class="step" id="step">Cargo 1 of 6</span></div>
      <h1 id="title">Rocket cargo</h1>
      <p class="instruction" id="instruction">How many stars does the rocket need? Count, then tap Load once for each one.</p>
      <div class="sky" aria-label="Rocket and cargo bay"><div class="stars" aria-hidden="true">✦　✦　　　✦　✦</div><div class="rocket" id="rocket" aria-hidden="true">🚀</div><div class="cargo" id="cargo" aria-label="Empty cargo bay"></div></div>
      <div class="target" id="target" aria-live="polite">1</div><p class="target-label">stars to load</p>
      <div class="controls"><button class="load-button" id="load" type="button" aria-label="Load one star">⭐</button><span class="loaded" id="loaded" aria-live="polite">Loaded: 0</span></div>
      <p class="feedback" id="feedback" aria-live="polite">Tap Load one time for each star.</p>
      <div class="actions"><button class="action" id="hear" type="button">🔊 Hear target</button><button class="action" id="reset" type="button">Start over</button></div>
    </section></main>
  </div>
  <script>
    (()=>{
      const rounds=[{n:1,item:'star',icon:'⭐'},{n:2,item:'moon',icon:'🌙'},{n:3,item:'planet',icon:'🪐'},{n:4,item:'star',icon:'⭐'},{n:5,item:'moon',icon:'🌙'},{n:6,item:'planet',icon:'🪐'}];
      const words=['one','two','three','four','five','six','seven','eight','nine','ten'];
      const step=document.getElementById('step'),target=document.getElementById('target'),cargo=document.getElementById('cargo'),loadedLabel=document.getElementById('loaded'),feedback=document.getElementById('feedback'),loadButton=document.getElementById('load'),rocket=document.getElementById('rocket');
      let round=0,loaded=0,locked=false,timer;
      function speak(text,after){if(!('speechSynthesis'in window)){if(after)after();return}YuaanSpeech.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;if(after){u.onend=after;u.onerror=after}YuaanSpeech.speak(u)}function sayTarget(){const item=rounds[round];speak(`The rocket needs ${words[item.n-1]} ${item.n===1?item.item:item.item+'s'}. Tap Load once for each one.`)}
      function render(){clearTimeout(timer);locked=false;loaded=0;const item=rounds[round];step.textContent=`Cargo ${round+1} of ${rounds.length}`;target.textContent=item.n;cargo.replaceChildren();cargo.setAttribute('aria-label','Empty cargo bay');loadedLabel.textContent='Loaded: 0';loadButton.disabled=false;loadButton.textContent=item.icon;loadButton.setAttribute('aria-label',`Load one ${item.item}`);rocket.classList.remove('launch');feedback.className='feedback';feedback.textContent=`Tap Load ${item.n===1?'one time':item.n+' times'} to count.`}
      function nextRound(){if(round===rounds.length-1){feedback.className='feedback good';feedback.textContent='All cargo loaded! Great counting, Yuaan!';return}round++;render();sayTarget()}
      loadButton.addEventListener('click',()=>{if(locked)return;const item=rounds[round];if(loaded>=item.n)return;loaded++;const piece=document.createElement('span');piece.className='cargo-item';piece.textContent=item.icon;piece.setAttribute('aria-hidden','true');cargo.append(piece);cargo.setAttribute('aria-label',`${loaded} of ${item.n} cargo items loaded`);loadedLabel.textContent=`Loaded: ${loaded}`;if(loaded===item.n){locked=true;loadButton.disabled=true;feedback.className='feedback good';feedback.textContent=`You loaded ${item.n} ${item.item}${item.n===1?'':'s'}! Count them: ${item.n}.`;speak(`You loaded ${words[item.n-1]}!`,()=>{rocket.classList.add('launch');timer=setTimeout(nextRound,1200)})}else{speak(String(loaded))}});
      document.getElementById('hear').addEventListener('click',sayTarget);
      document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);if('speechSynthesis'in window)YuaanSpeech.cancel();round=0;render();sayTarget()});
      render();window.addEventListener('load',()=>setTimeout(sayTarget,350));
    })();
  </script>
</body>
</html>
