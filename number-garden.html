<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4eb">
  <title>Garden Count | Yuaan’s Playroom</title>
  <style>
    :root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f6f4eb;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;--line:#e4e1d5;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}.page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}.brand{color:var(--muted);font-size:.88rem;font-weight:800}main{flex:1;display:grid;align-content:center;padding:22px 0 48px}.panel{padding:clamp(18px,4vw,32px);border:1px solid var(--line);border-radius:26px;background:var(--card);box-shadow:0 12px 30px rgba(42,60,65,.05)}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{margin:0;color:var(--green-ink);font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.step{color:var(--muted);font-size:.85rem;font-weight:800}h1{margin:7px 0 0;font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.05em}.instruction{margin:7px 0 18px;color:var(--muted);font-size:.97rem;line-height:1.45}.garden{min-height:188px;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.7vw,22px);padding:20px 14px;border:1px solid #d9e7d8;border-radius:20px;background:linear-gradient(#eaf2e8 0 70%,#d5e4cc 70%);overflow:hidden}.flower{display:grid;place-items:center;width:clamp(43px,11vw,70px);height:clamp(56px,14vw,90px);border-radius:40% 40% 20% 20%;background:rgba(255,254,250,.86);font-size:clamp(2rem,8vw,3.5rem);animation:bloom .35s ease-out both;animation-delay:calc(var(--i)*70ms)}@keyframes bloom{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}.question{margin:17px 0 12px;text-align:center;font-size:1.12rem;font-weight:850}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.choice{min-height:60px;border:2px solid #cbdcc9;border-radius:17px;background:#eff6e9;color:var(--ink);font:inherit;font-size:1.65rem;font-weight:950;cursor:pointer;touch-action:manipulation}.choice:active{transform:scale(.95)}.choice:disabled{cursor:default;opacity:.7}.feedback{min-height:48px;display:flex;align-items:center;justify-content:center;margin:9px 0 0;color:var(--muted);font-weight:800;text-align:center}.feedback.good{color:var(--green-ink)}.feedback.try{color:#9a643e}.actions{display:flex;justify-content:center;gap:9px;margin-top:5px}.action{min-height:43px;padding:0 14px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}.choice:focus-visible,.action:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}@media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:17px 12px;border-radius:21px}.garden{min-height:156px;gap:6px;padding:15px 8px}.choice{min-height:55px;border-radius:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="page"><header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header>
    <main><section class="panel" aria-labelledby="title"><div class="topline"><p class="eyebrow">Count the flowers</p><span class="step" id="step">Garden 1 of 6</span></div><h1 id="title">Garden count</h1><p class="instruction">Touch each flower and count it. Then tap the number that tells how many flowers you see.</p><div class="garden" id="garden" aria-label="Flowers to count"></div><p class="question">How many flowers?</p><div class="choices" id="choices" aria-label="Choose the number of flowers"></div><p class="feedback" id="feedback" aria-live="polite">Touch each flower as you count.</p><div class="actions"><button class="action" id="hear" type="button">🔊 Hear question</button><button class="action" id="reset" type="button">Start over</button></div></section></main>
  </div>
  <script>
    (()=>{
      const rounds=[{n:1,flower:'🌼'},{n:2,flower:'🌷'},{n:3,flower:'🌻'},{n:4,flower:'🌼'},{n:5,flower:'🌷'},{n:6,flower:'🌻'}],words=['one','two','three','four','five','six','seven','eight','nine','ten'];
      const garden=document.getElementById('garden'),choices=document.getElementById('choices'),feedback=document.getElementById('feedback'),step=document.getElementById('step');let index=0,answered=false,timer;
      function speak(text,after){if(!('speechSynthesis'in window)){if(after)after();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;if(after)u.onend=after;speechSynthesis.speak(u)}
      function sayQuestion(){speak('Touch each flower and count. How many flowers are there?')}
      function render(){clearTimeout(timer);answered=false;const round=rounds[index];step.textContent=`Garden ${index+1} of ${rounds.length}`;garden.replaceChildren();for(let i=0;i<round.n;i++){const flower=document.createElement('span');flower.className='flower';flower.style.setProperty('--i',i);flower.textContent=round.flower;flower.setAttribute('aria-label',`Flower ${i+1}`);flower.addEventListener('click',()=>{if(!answered)speak(String(i+1))});garden.append(flower)}choices.replaceChildren();for(let n=1;n<=6;n++){const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=n;b.setAttribute('aria-label',String(n));b.addEventListener('click',()=>answer(n));choices.append(b)}feedback.className='feedback';feedback.textContent='Touch each flower as you count.'}
      function answer(n){if(answered)return;const round=rounds[index];if(n!==round.n){feedback.className='feedback try';feedback.textContent='Count each flower once. Which number tells how many?';speak('Count each flower once. Which number tells how many?');return}answered=true;for(const b of choices.children)b.disabled=true;feedback.className='feedback good';feedback.textContent=`Yes! ${round.n} ${round.n===1?'flower':'flowers'}. You counted them!`;speak(`Yes, ${words[round.n-1]} ${round.n===1?'flower':'flowers'}. Nice counting, Yuaan!`,()=>{timer=setTimeout(()=>{if(index===rounds.length-1){feedback.textContent='You counted every garden! Great work, Yuaan!';return}index++;render();sayQuestion()},1100)})}
      document.getElementById('hear').addEventListener('click',sayQuestion);document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);if('speechSynthesis'in window)speechSynthesis.cancel();index=0;render();sayQuestion()});render();window.addEventListener('load',()=>setTimeout(sayQuestion,350));
    })();
  </script>
</body>
</html>
