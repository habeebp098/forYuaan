<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f4ef"><title>Build a Number Tower | Yuaan’s Playroom</title><style>
:root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f5f4ef;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}.page{width:min(100% - 28px,720px);min-height:100svh;margin:auto;display:flex;flex-direction:column}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}.brand{color:var(--muted);font-size:.88rem;font-weight:800}main{flex:1;display:grid;align-content:center;padding:22px 0 48px}.panel{padding:clamp(18px,4vw,32px);border:1px solid #e3e1d8;border-radius:26px;background:var(--card);box-shadow:0 12px 30px #2a3c410d}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{margin:0;color:#487477;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.step{color:var(--muted);font-size:.85rem;font-weight:800}h1{margin:7px 0 0;font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.05em}.instruction{margin:7px 0 16px;color:var(--muted);font-size:.97rem;line-height:1.45}.build-area{min-height:265px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px 12px 20px;border:1px solid #dce8df;border-radius:20px;background:linear-gradient(#edf4f2 0 73%,#dce8d6 73%);position:relative}.target{position:absolute;top:15px;color:#566c70;font-weight:850}.target strong{font-size:2rem;color:#806a36}.tower{min-height:156px;width:min(100%,310px);display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:3px}.block{width:min(52%,180px);height:27px;border:2px solid rgba(255,255,255,.7);border-radius:8px;background:#e8b873;box-shadow:0 3px 0 #d39b58;animation:drop .22s ease-out}.block:nth-child(3n+2){background:#a9c9bd;box-shadow:0 3px 0 #87ac9e}.block:nth-child(3n){background:#d8a9a4;box-shadow:0 3px 0 #c88e88}@keyframes drop{from{transform:translateY(-20px);opacity:.3}to{transform:none;opacity:1}}.progress{margin-top:9px;color:var(--muted);font-weight:850}.feedback{min-height:49px;display:flex;align-items:center;justify-content:center;margin:8px 0 0;color:var(--muted);font-weight:850;text-align:center}.feedback.good{color:var(--green-ink)}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:5px}.action{min-height:46px;padding:0 17px;border:1px solid #e3dfd3;border-radius:14px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}.action.primary{border-color:#c8d9c5;background:#e7f0e2}.action:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}@media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:17px 12px;border-radius:21px}.build-area{min-height:240px}.tower{min-height:140px}.block{height:25px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style></head><body><div class="page"><header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header><main><section class="panel"><div class="topline"><p class="eyebrow">Count and build</p><span class="step" id="step">Tower 1 of 5</span></div><h1>Build a number tower</h1><p class="instruction">Look at the number. Add blocks and count each one as you build your tower.</p><div class="build-area"><div class="target">Build <strong id="target">1</strong> <span id="block-word">block</span></div><div class="tower" id="tower" aria-label="Your tower"></div></div><p class="progress" id="progress" aria-live="polite">Blocks: 0</p><p class="feedback" id="feedback" aria-live="polite">Tap Add a block to begin counting.</p><div class="actions"><button class="action primary" id="add" type="button">＋ Add a block</button><button class="action" id="hear" type="button">🔊 Hear the number</button><button class="action" id="reset" type="button">Start over</button></div></section></main></div><script>
(()=>{const rounds=[1,2,3,4,5],words=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];const tower=document.getElementById('tower'),target=document.getElementById('target'),blockWord=document.getElementById('block-word'),step=document.getElementById('step'),progress=document.getElementById('progress'),feedback=document.getElementById('feedback'),add=document.getElementById('add');let index=0,count=0,done=false,timer;let speechFallback;function speak(text,after){clearTimeout(speechFallback);let finished=false;const finish=()=>{if(finished)return;finished=true;clearTimeout(speechFallback);if(after)after()};if(!('speechSynthesis'in window)){finish();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;if(after){u.onend=finish;u.onerror=finish;speechFallback=setTimeout(finish,Math.max(3500,text.length*120))}speechSynthesis.speak(u)}function prompt(){const n=rounds[index];speak(`Build a tower with ${words[n]} ${n===1?'block':'blocks'}. Tap Add a block and count each one.`)}function render(){clearTimeout(timer);count=0;done=false;target.textContent=rounds[index];blockWord.textContent=rounds[index]===1?'block':'blocks';step.textContent=`Tower ${index+1} of ${rounds.length}`;tower.replaceChildren();tower.setAttribute('aria-label','Empty tower');progress.textContent='Blocks: 0';feedback.className='feedback';feedback.textContent='Tap Add a block and count each one.';add.disabled=false}add.addEventListener('click',()=>{if(done)return;count++;const block=document.createElement('span');block.className='block';block.setAttribute('aria-label',`Block ${count}`);tower.append(block);tower.setAttribute('aria-label',`Tower with ${count} ${count===1?'block':'blocks'}`);progress.textContent=`Blocks: ${count}`;speak(String(count));if(count===rounds[index]){done=true;add.disabled=true;feedback.className='feedback good';feedback.textContent=`You built ${count}! Counted just right!`;speak(`You built ${words[count]} ${count===1?'block':'blocks'}! Great counting, Yuaan!`,()=>{timer=setTimeout(()=>{if(index===rounds.length-1){feedback.textContent='You built every tower! Fantastic counting, Yuaan!';return}index++;render();prompt()},1300)})}});document.getElementById('hear').addEventListener('click',()=>speak(`Build a tower with ${words[rounds[index]]} ${rounds[index]===1?'block':'blocks'}.`));document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);if('speechSynthesis'in window)speechSynthesis.cancel();index=0;render();prompt()});render();window.addEventListener('load',()=>setTimeout(prompt,350))})();
</script></body></html>
