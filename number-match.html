<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4eb">
  <title>Match the Number | Yuaan’s Playroom</title>
  <style>
    :root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f7f4eb;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;--gold:#f3e4bb;--soft:#f4f6ef;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}
    .page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}
    header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}
    .brand{color:var(--muted);font-size:.88rem;font-weight:800}
    main{flex:1;display:grid;align-content:center;padding:22px 0 48px}
    .panel{padding:clamp(18px,4vw,32px);border:1px solid #e6e0cf;border-radius:26px;background:var(--card);box-shadow:0 12px 30px rgba(42,60,65,.05)}
    .eyebrow{margin:0 0 7px;color:var(--green-ink);font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(1.7rem,5vw,2.45rem);letter-spacing:-.05em}
    .instruction{margin:7px 0 15px;color:var(--muted);font-size:.97rem;line-height:1.45}
    .prompt{display:flex;align-items:center;justify-content:center;gap:12px;min-height:78px;margin-bottom:13px;padding:10px;border-radius:16px;background:#f3f5eb}
    .target{color:#806a36;font-size:clamp(2.4rem,9vw,3.5rem);font-weight:950;line-height:1}
    .prompt-text{font-size:1rem;font-weight:850}
    .groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .group{min-width:0;min-height:124px;padding:10px 6px;border:2px solid #e4e8dd;border-radius:17px;background:var(--soft);font:inherit;cursor:pointer;transition:transform .14s,border-color .14s,background .14s}
    .group:hover{transform:translateY(-2px);border-color:#c5d8c1}.group:active{transform:scale(.98)}.group:disabled{cursor:default;opacity:.7}
    .objects{min-height:78px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:5px}
    .object{width:clamp(22px,5vw,34px);height:clamp(22px,5vw,34px);display:grid;place-items:center;border-radius:8px;background:#fff;font-size:clamp(1rem,3.8vw,1.45rem);box-shadow:0 2px 0 #e5e9e1}
    .group-label{display:block;margin-top:7px;color:var(--muted);font-size:.78rem;font-weight:800}
    .feedback{min-height:43px;display:flex;align-items:center;justify-content:center;margin:8px 0 0;color:var(--muted);font-weight:800;text-align:center}
    .feedback.good{color:var(--green-ink)}.feedback.try{color:#876b32}
    .actions{display:flex;justify-content:center;gap:9px;margin-top:4px}
    .action{min-height:43px;padding:0 14px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}
    @media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:18px 12px;border-radius:21px}.groups{gap:6px}.group{min-height:113px;padding:8px 4px;border-radius:14px}.objects{min-height:72px;gap:4px}.object{border-radius:6px}.group-label{font-size:.72rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
  </style>
<script src="speech.js?v=1"></script>
</head>
<body>
  <div class="page">
    <header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header>
    <main><section class="panel" aria-labelledby="title">
      <p class="eyebrow">Number and amount</p>
      <h1 id="title">Match the number</h1>
      <p class="instruction">Look at the number. Tap the group that has that many things.</p>
      <div class="prompt" aria-live="polite"><span class="target" id="target">1</span><span class="prompt-text">Find a group with this many.</span></div>
      <div class="groups" id="groups" aria-label="Choose the group that matches"></div>
      <p class="feedback" id="feedback" aria-live="polite">Which group matches the number?</p>
      <div class="actions"><button class="action" id="hear" type="button">🔊 Hear the number</button><button class="action" id="reset" type="button">Start over</button></div>
    </section></main>
  </div>
  <script>
    (()=>{
      const rounds=[
        {n:1,icon:'🍎',options:[3,1,4]}, {n:2,icon:'⭐',options:[2,5,1]},
        {n:3,icon:'🐠',options:[4,3,1]}, {n:4,icon:'🧸',options:[2,5,4]},
        {n:5,icon:'🍓',options:[5,3,7]}, {n:6,icon:'🚗',options:[8,6,4]},
        {n:7,icon:'🦋',options:[5,7,9]}, {n:8,icon:'🐥',options:[8,6,10]},
        {n:9,icon:'🍪',options:[7,9,10]}, {n:10,icon:'🪁',options:[10,8,6]}
      ];
      const words=['one','two','three','four','five','six','seven','eight','nine','ten'];
      const groups=document.getElementById('groups'),target=document.getElementById('target'),feedback=document.getElementById('feedback'),hear=document.getElementById('hear');
      let index=0,answered=false,advanceTimer;
      function speak(text,after){if(!('speechSynthesis'in window)){if(after)after();return}YuaanSpeech.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;if(after)u.onend=after;YuaanSpeech.speak(u)}
      function sayQuestion(){speak(`Find the group with ${words[rounds[index].n-1]}.`)}
      function render(){clearTimeout(advanceTimer);answered=false;hear.disabled=false;const round=rounds[index];target.textContent=round.n;groups.replaceChildren();round.options.forEach((amount,optionIndex)=>{const button=document.createElement('button');button.type='button';button.className='group';button.setAttribute('aria-label',`Group ${optionIndex+1}, ${amount} objects`);button.addEventListener('click',()=>choose(amount));const objects=document.createElement('span');objects.className='objects';for(let i=0;i<amount;i++){const object=document.createElement('span');object.className='object';object.textContent=round.icon;object.setAttribute('aria-hidden','true');objects.append(object)}const label=document.createElement('span');label.className='group-label';label.textContent='Tap this group';button.append(objects,label);groups.append(button)});feedback.className='feedback';feedback.textContent='Which group matches the number?'}
      function advance(){if(index===rounds.length-1){feedback.className='feedback good';feedback.textContent='You matched every number! Great work, Yuaan!';return}index++;render();sayQuestion()}
      function choose(amount){if(answered)return;if(amount!==rounds[index].n){feedback.className='feedback try';feedback.textContent='Count the things in each group. Which group has the same amount as the number?';speak('Count the things. Which group has the same amount as the number?');return}answered=true;hear.disabled=true;feedback.className='feedback good';feedback.textContent=`Yes! That group has ${amount}.`;for(const button of groups.children)button.disabled=true;speak(`Yes. That group has ${words[amount-1]}.`,()=>{advanceTimer=setTimeout(advance,1100)})}
      hear.addEventListener('click',sayQuestion);
      document.getElementById('reset').addEventListener('click',()=>{if('speechSynthesis'in window)YuaanSpeech.cancel();index=0;render();sayQuestion()});
      render();window.addEventListener('load',()=>setTimeout(sayQuestion,350));
    })();
  </script>
</body>
</html>
