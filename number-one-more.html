<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4eb">
  <title>One More | Yuaan’s Playroom</title>
  <style>
    :root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f7f4eb;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;--gold:#f3e4bb;--soft:#f4f6ef;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}
    .page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}
    header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}
    .brand{color:var(--muted);font-size:.88rem;font-weight:800}
    main{flex:1;display:grid;align-content:center;padding:22px 0 48px}
    .panel{padding:clamp(18px,4vw,32px);border:1px solid #e6e0cf;border-radius:26px;background:var(--card);box-shadow:0 12px 30px rgba(42,60,65,.05)}
    .eyebrow{margin:0 0 7px;color:var(--green-ink);font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(1.7rem,5vw,2.45rem);letter-spacing:-.05em}
    .instruction{margin:7px 0 14px;color:var(--muted);font-size:.97rem;line-height:1.45}
    .story{margin:0 0 12px;padding:12px;border-radius:15px;background:#f3f5eb;text-align:center;font-weight:850;line-height:1.4}
    .collection{min-height:124px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:17px;background:var(--soft)}
    .object{width:clamp(40px,8vw,56px);height:clamp(40px,8vw,56px);display:grid;place-items:center;border-radius:14px;background:white;font-size:clamp(1.6rem,5vw,2.1rem);box-shadow:0 3px 0 #e5e9e1}
    .add{display:block;min-height:49px;margin:12px auto 0;padding:0 18px;border:0;border-radius:14px;background:var(--gold);color:#685522;font:inherit;font-weight:900;cursor:pointer}
    .add:disabled{opacity:.6;cursor:default}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:16px}
    .choice{min-height:54px;border:2px solid #d5e4d3;border-radius:14px;background:var(--green);color:#315b3e;font:inherit;font-size:1.45rem;font-weight:950;cursor:pointer;box-shadow:0 4px 0 #c3d8c1;transition:transform .12s}.choice:active{transform:translateY(3px)}.choice:disabled{opacity:.65;cursor:default}
    .feedback{min-height:44px;display:flex;align-items:center;justify-content:center;margin:8px 0 0;color:var(--muted);font-weight:800;text-align:center}.feedback.good{color:var(--green-ink)}.feedback.try{color:#876b32}
    .actions{display:flex;justify-content:center;gap:9px;margin-top:3px}.action{min-height:43px;padding:0 14px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}
    @media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:18px 13px;border-radius:21px}.collection{min-height:112px;gap:6px;padding:10px}.object{border-radius:12px}.choices{gap:6px}.choice{min-height:49px;border-radius:12px;font-size:1.3rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="page">
    <header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header>
    <main><section class="panel" aria-labelledby="title">
      <p class="eyebrow">Adding one</p>
      <h1 id="title">One more</h1>
      <p class="instruction">See how the group changes when one more joins.</p>
      <p class="story" id="story" aria-live="polite">There is 1 apple. Add one more apple.</p>
      <div class="collection" id="collection" aria-label="The group"></div>
      <button class="add" id="add" type="button">＋ Add one</button>
      <p class="instruction" id="question" hidden>Count the group again. How many are there now?</p>
      <div class="choices" id="choices" aria-label="Choose the total"></div>
      <p class="feedback" id="feedback" aria-live="polite">Tap “Add one” to see the new group.</p>
      <div class="actions"><button class="action" id="hear" type="button">🔊 Hear the story</button><button class="action" id="reset" type="button">Start over</button></div>
    </section></main>
  </div>
  <script>
    (()=>{
      const rounds=[
        {start:1,icon:'🍎',one:'apple',many:'apples'}, {start:2,icon:'⭐',one:'star',many:'stars'},
        {start:3,icon:'🐠',one:'fish',many:'fish'}, {start:4,icon:'🧸',one:'teddy bear',many:'teddy bears'},
        {start:5,icon:'🍓',one:'strawberry',many:'strawberries'}, {start:6,icon:'🚗',one:'car',many:'cars'},
        {start:7,icon:'🦋',one:'butterfly',many:'butterflies'}, {start:8,icon:'🐥',one:'chick',many:'chicks'},
        {start:9,icon:'🍪',one:'cookie',many:'cookies'}
      ];
      const words=['one','two','three','four','five','six','seven','eight','nine','ten'];
      const collection=document.getElementById('collection'),story=document.getElementById('story'),addButton=document.getElementById('add'),question=document.getElementById('question'),choices=document.getElementById('choices'),feedback=document.getElementById('feedback'),hear=document.getElementById('hear');
      let index=0,added=false,solved=false,advanceTimer;
      function speak(text,after){if(!('speechSynthesis'in window)){if(after)after();return}speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(text);voice.rate=.78;voice.pitch=1.08;if(after)voice.onend=after;speechSynthesis.speak(voice)}
      function sayStory(){const item=rounds[index];const first=item.start===1?'There is one apple.':`There are ${words[item.start-1]} ${item.many}.`;speak(`${first} Tap add one more ${item.one}.`)}
      function render(){clearTimeout(advanceTimer);added=false;solved=false;addButton.disabled=false;hear.disabled=false;question.hidden=true;const item=rounds[index];const first=item.start===1?'There is 1 apple.':`There are ${item.start} ${item.many}.`;story.textContent=`${first} Add one more ${item.one}.`;collection.replaceChildren();for(let n=0;n<item.start;n++){const object=document.createElement('span');object.className='object';object.textContent=item.icon;object.setAttribute('aria-hidden','true');collection.append(object)}choices.replaceChildren();for(let n=1;n<=10;n++){const button=document.createElement('button');button.type='button';button.className='choice';button.textContent=n;button.setAttribute('aria-label',String(n));button.disabled=true;button.addEventListener('click',()=>choose(n));choices.append(button)}feedback.className='feedback';feedback.textContent='Tap “Add one” to see the new group.'}
      function advance(){if(index===rounds.length-1){window.location.href='number-hippo.html';return}index++;render();sayStory()}
      addButton.addEventListener('click',()=>{if(added)return;added=true;addButton.disabled=true;const item=rounds[index];const object=document.createElement('span');object.className='object';object.textContent=item.icon;object.setAttribute('aria-label','One more item');collection.append(object);question.hidden=false;feedback.className='feedback';feedback.textContent='Now choose how many there are.';for(const button of choices.children)button.disabled=false;speak('Now count the group again. How many are there now?')});
      function choose(number){if(solved||!added)return;const answer=rounds[index].start+1;if(number!==answer){feedback.className='feedback try';feedback.textContent='Count the whole group again.';speak('Count the whole group again.');return}solved=true;hear.disabled=true;for(const button of choices.children)button.disabled=true;feedback.className='feedback good';feedback.textContent=`Yes! One more makes ${answer}.`;speak(`One more makes ${words[answer-1]}.`,()=>{advanceTimer=setTimeout(advance,1100)})}
      hear.addEventListener('click',()=>{if(added)speak('Now count the group again. How many are there now?');else sayStory()});
      document.getElementById('reset').addEventListener('click',()=>{clearTimeout(advanceTimer);if('speechSynthesis'in window)speechSynthesis.cancel();index=0;render();sayStory()});
      render();window.addEventListener('load',()=>setTimeout(sayStory,350));
    })();
  </script>
</body>
</html>
