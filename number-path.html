<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f4ef"><title>Number Path | Yuaan’s Playroom</title><style>
:root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f5f4ef;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}.page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}.brand{color:var(--muted);font-size:.88rem;font-weight:800}main{flex:1;display:grid;align-content:center;padding:22px 0 48px}.panel{padding:clamp(18px,4vw,32px);border:1px solid #e3e1d8;border-radius:26px;background:var(--card);box-shadow:0 12px 30px #2a3c410d}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{margin:0;color:#487477;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.step{color:var(--muted);font-size:.85rem;font-weight:800}h1{margin:7px 0 0;font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.05em}.instruction{margin:7px 0 18px;color:var(--muted);font-size:.97rem;line-height:1.45}.path{position:relative;min-height:250px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);align-items:center;justify-items:center;gap:16px 8px;padding:18px 8px;border:1px solid #dce8df;border-radius:20px;background:linear-gradient(155deg,#edf4e9,#e5f0ec)}.number{position:relative;z-index:1;width:clamp(48px,12vw,74px);height:clamp(48px,12vw,74px);border:2px solid #cadbd1;border-radius:50%;background:#fffefa;color:var(--ink);font:inherit;font-size:clamp(1.4rem,5vw,2rem);font-weight:950;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #d7e1d9}.number:disabled{opacity:.48;cursor:default}.number.current{border-color:#d9bd78;background:#fff3d6;box-shadow:0 4px 0 #ead7aa;animation:pulse 1.3s ease-in-out infinite}.number.done{border-color:#b8d0b8;background:#e4f0df;color:#3c684c}.number:active:not(:disabled){transform:scale(.94)}@keyframes pulse{50%{transform:scale(1.06)}}.feedback{min-height:52px;display:flex;align-items:center;justify-content:center;margin:12px 0 0;color:var(--muted);font-weight:850;text-align:center}.feedback.good{color:var(--green-ink)}.actions{display:flex;justify-content:center;gap:9px;margin-top:5px}.action{min-height:44px;padding:0 15px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}@media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:17px 12px;border-radius:21px}.path{min-height:214px;gap:10px 3px;padding:13px 4px}.number{width:clamp(45px,13vw,62px);height:clamp(45px,13vw,62px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style></head><body><div class="page"><header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header><main><section class="panel"><div class="topline"><p class="eyebrow">Follow the number path</p><span class="step" id="step">0 of 10</span></div><h1>Number path</h1><p class="instruction">Start at 1. Tap the next number each time to walk along the path to 10.</p><div class="path" id="path" aria-label="Number path from one to ten"></div><p class="feedback" id="feedback" aria-live="polite">Find number 1 to begin.</p><div class="actions"><button class="action" id="hear" type="button">🔊 Hear next number</button><button class="action" id="reset" type="button">Start over</button></div></section></main></div><script>
(()=>{const words=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];const path=document.getElementById('path'),feedback=document.getElementById('feedback'),step=document.getElementById('step');let next=1;function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}function render(){path.replaceChildren();for(let n=1;n<=10;n++){const b=document.createElement('button');b.type='button';b.className='number'+(n===next?' current':'')+(n<next?' done':'');b.textContent=n;b.setAttribute('aria-label',`Number ${n}`);b.disabled=n!==next;b.addEventListener('click',()=>{if(n!==next)return;b.classList.add('done');if(next===10){step.textContent='10 of 10';feedback.className='feedback good';feedback.textContent='You reached ten! Wonderful number order, Yuaan!';next=11;speak('Ten! You reached the end. Great counting, Yuaan!');path.querySelectorAll('button').forEach(x=>x.disabled=true);return}next++;step.textContent=`${next-1} of 10`;feedback.className='feedback';feedback.textContent=`Great! Now find ${next}.`;render();speak(words[next-1])});path.append(b)}if(next===11)path.querySelectorAll('button').forEach(b=>{b.classList.add('done');b.disabled=true})}document.getElementById('hear').addEventListener('click',()=>speak(next<=10?`Find number ${words[next]}.`:'You reached ten!'));document.getElementById('reset').addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();next=1;step.textContent='0 of 10';feedback.className='feedback';feedback.textContent='Find number 1 to begin.';render();speak('Find number one to begin.')});render();window.addEventListener('load',()=>setTimeout(()=>speak('Start at one. Tap each next number to walk along the path.'),350))})();
</script></body></html>
