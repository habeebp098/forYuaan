<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f4ef"><title>Number Memory | Yuaan’s Playroom</title><style>
:root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f5f4ef;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}.page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}.brand{color:var(--muted);font-size:.88rem;font-weight:800}main{flex:1;display:grid;align-content:center;padding:22px 0 48px}.panel{padding:clamp(18px,4vw,32px);border:1px solid #e3e1d8;border-radius:26px;background:var(--card);box-shadow:0 12px 30px #2a3c410d}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{margin:0;color:#725b86;font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.step{color:var(--muted);font-size:.85rem;font-weight:800}h1{margin:7px 0 0;font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.05em}.instruction{margin:7px 0 16px;color:var(--muted);font-size:.97rem;line-height:1.45}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{min-height:112px;border:2px solid #ddd3e6;border-radius:18px;background:#f5eff8;color:var(--ink);font:inherit;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #e6deeb;transition:transform .15s ease,background .15s ease}.card:active{transform:scale(.97)}.card:disabled{cursor:default}.card .back{font-size:2rem;color:#806d8a}.card .face{display:none}.card.open,.card.matched{background:#fffefa;border-color:#c9b8d6}.card.open .back,.card.matched .back{display:none}.card.open .face,.card.matched .face{display:grid;place-items:center;min-height:104px}.digit{font-size:2.8rem;font-weight:950}.objects{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px 4px;padding:6px;font-size:1.55rem;line-height:1.05}.feedback{min-height:52px;display:flex;align-items:center;justify-content:center;margin:10px 0 0;color:var(--muted);font-weight:850;text-align:center}.feedback.good{color:var(--green-ink)}.actions{display:flex;justify-content:center;gap:9px;margin-top:5px}.action{min-height:44px;padding:0 15px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}@media(max-width:440px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:17px 12px;border-radius:21px}.board{gap:7px}.card{min-height:92px;border-radius:14px}.card.open .face,.card.matched .face{min-height:84px}.digit{font-size:2.4rem}.objects{font-size:1.28rem;gap:2px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style></head><body><div class="page"><header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header><main><section class="panel"><div class="topline"><p class="eyebrow">Find number pairs</p><span class="step" id="step">Round 1 of 3</span></div><h1>Number memory</h1><p class="instruction">Turn over two cards. Match a number to a group with that many things.</p><div class="board" id="board" aria-label="Number and object matching cards"></div><p class="feedback" id="feedback" aria-live="polite">Find a number and its matching group.</p><div class="actions"><button class="action" id="hear" type="button">🔊 Hear instructions</button><button class="action" id="reset" type="button">Start over</button></div></section></main></div><script>
(()=>{const rounds=[{values:[1,2,3],icon:'🍎',name:'apples'},{values:[2,3,4],icon:'🐠',name:'fish'},{values:[1,3,5],icon:'⭐',name:'stars'}],words=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];const board=document.getElementById('board'),feedback=document.getElementById('feedback'),step=document.getElementById('step');let round=0,open=[],matched=0,lock=false,timer;let speechFallback;function speak(text,after){clearTimeout(speechFallback);let finished=false;const finish=()=>{if(finished)return;finished=true;clearTimeout(speechFallback);if(after)after()};if(!('speechSynthesis'in window)){finish();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;if(after){u.onend=finish;u.onerror=finish;speechFallback=setTimeout(finish,Math.max(3500,text.length*120))}speechSynthesis.speak(u)}function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}function render(){clearTimeout(timer);open=[];matched=0;lock=false;const data=rounds[round];step.textContent=`Round ${round+1} of ${rounds.length}`;feedback.className='feedback';feedback.textContent='Find a number and its matching group.';const cards=[];for(const n of data.values){cards.push({type:'number',n,key:n},{type:'group',n,key:n})}board.replaceChildren();for(const item of shuffle(cards)){const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','Hidden card');b.dataset.key=item.key;b.dataset.type=item.type;const back=document.createElement('span');back.className='back';back.textContent='?';back.setAttribute('aria-hidden','true');const face=document.createElement('span');face.className='face';if(item.type==='number'){face.innerHTML=`<span class="digit">${item.n}</span>`;b.setAttribute('aria-label',`Hidden number card`)}else{const group=document.createElement('span');group.className='objects';group.setAttribute('aria-label',`${item.n} ${data.name}`);for(let i=0;i<item.n;i++){const obj=document.createElement('span');obj.textContent=data.icon;obj.setAttribute('aria-hidden','true');group.append(obj)}face.append(group)}b.append(back,face);b.addEventListener('click',()=>flip(b,item,data));board.append(b)}}function flip(button,item,data){if(lock||button.classList.contains('open')||button.classList.contains('matched'))return;button.classList.add('open');button.setAttribute('aria-label',item.type==='number'?`Number ${item.n}`:`${item.n} ${data.name}`);open.push({button,item});speak(item.type==='number'?words[item.n]:`${words[item.n]} ${data.name}`);if(open.length<2)return;lock=true;const[a,b]=open;if(a.item.key===b.item.key&&a.item.type!==b.item.type){a.button.classList.add('matched');b.button.classList.add('matched');a.button.disabled=true;b.button.disabled=true;matched++;feedback.className='feedback good';feedback.textContent=`Match! ${a.item.n} ${data.name}.`;open=[];lock=false;if(matched===data.values.length){speak('All the pairs match! Nice number memory, Yuaan!',()=>{timer=setTimeout(()=>{if(round===rounds.length-1){feedback.textContent='You found every pair! Great number memory, Yuaan!';return}round++;render();speak('New cards! Find each number and its group.')},1200)})}}else{feedback.className='feedback';feedback.textContent='Not a pair. Look and try two more.';timer=setTimeout(()=>{for(const entry of open){entry.button.classList.remove('open');entry.button.setAttribute('aria-label','Hidden card')}open=[];lock=false},950)}}document.getElementById('hear').addEventListener('click',()=>speak('Turn over two cards. Match a number to a group with that many things.'));document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);if('speechSynthesis'in window)speechSynthesis.cancel();round=0;render();speak('Find a number and its matching group.')});render();window.addEventListener('load',()=>setTimeout(()=>speak('Turn over two cards. Match a number to a group with that many things.'),350))})();
</script></body></html>
