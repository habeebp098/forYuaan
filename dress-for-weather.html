<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ef">
  <title>Dress for the Weather | Yuaan’s Playroom</title>
  <link rel="stylesheet" href="play-activities.css">
  <link rel="stylesheet" href="dress-for-weather.css">
  <script src="speech.js?v=1" defer></script>
  <script src="dress-for-weather.js" defer></script>
</head>
<body>
<div class="page">
  <header><a class="home" href="index.html">← Home</a><span>Yuaan’s Playroom</span></header>
  <main><section class="panel" aria-labelledby="title">
    <div class="top"><span class="badge" aria-hidden="true">🌦️</span><span id="progress">Ready to play</span></div>
    <h1 id="title">Dress for the Weather</h1>
    <p class="subtitle">Help Yuaan get ready to go outside.</p>
    <div id="welcome" class="weather-welcome">
      <div class="welcome-icon" aria-hidden="true">🧒 🌤️</div>
      <p>Ready to get dressed, Yuaan?</p>
      <button class="primary" id="start" type="button">▶ Let’s play</button>
    </div>
    <div id="game" hidden>
      <div id="weather-scene" class="weather-scene" aria-label="Weather scene">
        <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
        <div class="child"><span class="child-face" aria-hidden="true">🧒</span><span id="worn" class="worn" aria-hidden="true"></span></div>
        <span id="weather-label" class="weather-label"></span>
      </div>
      <p id="question" class="prompt"></p>
      <div id="choices" class="choices" aria-label="Things to choose from"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <div class="actions"><button id="hear" type="button">🔊 Hear again</button><button id="reset" type="button">↻ Start over</button></div>
    </div>
    <noscript>Please turn on JavaScript to play this activity.</noscript>
  </section></main><footer>Made for Yuaan ♥</footer>
</div>
</body>
</html>
