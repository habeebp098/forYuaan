<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f4eb"><title>Which Has Fewer? | Yuaan’s Playroom</title><style>
:root{color-scheme:light;--ink:#293b4a;--muted:#667682;--paper:#f7f4eb;--card:#fffefa;--green:#dcebdc;--green-ink:#3c684c;--gold:#f3e4bb;--soft:#f4f6ef;font-family:"Avenir Next",Avenir,"Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper)}.page{width:min(100% - 28px,760px);min-height:100svh;margin:auto;display:flex;flex-direction:column}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.home{min-height:42px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid #e3dfd3;border-radius:13px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.92rem;font-weight:850}.brand{color:var(--muted);font-size:.88rem;font-weight:800}main{flex:1;display:grid;align-content:center;padding:24px 0 54px}.panel{padding:clamp(20px,5vw,36px);border:1px solid #e6e0cf;border-radius:26px;background:var(--card);box-shadow:0 12px 30px rgba(42,60,65,.05)}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{margin:0 0 8px;color:var(--green-ink);font-size:.76rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.round{color:var(--muted);font-size:.87rem;font-weight:800}h1{margin:0;font-size:clamp(1.8rem,6vw,2.7rem);letter-spacing:-.05em}.instruction{margin:8px 0 14px;color:var(--muted);font-size:1rem;line-height:1.5}.prompt{margin:12px 0;text-align:center;font-size:1.08rem;font-weight:900}.groups{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.group{width:100%;min-width:0;padding:13px 9px 15px;border:2px solid #e5e9df;border-radius:18px;background:var(--soft);font:inherit;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}.group:hover{transform:translateY(-2px)}.things{min-height:112px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:6px}.thing{width:clamp(26px,5.7vw,39px);height:clamp(26px,5.7vw,39px);display:grid;place-items:center;border-radius:9px;background:#fff;font-size:clamp(1.1rem,4vw,1.7rem);box-shadow:0 2px 0 #e6e9e1}.group-label{display:block;margin-top:7px;color:var(--muted);font-size:.82rem;font-weight:800}.versus{color:#9b927e;font-size:.83rem;font-weight:900}.feedback{min-height:46px;display:flex;align-items:center;justify-content:center;margin:9px 0 0;color:var(--muted);font-weight:800;text-align:center}.feedback.good{color:var(--green-ink)}.feedback.try{color:#876b32}.actions{display:flex;justify-content:center;gap:9px;margin-top:4px}.action{min-height:43px;padding:0 14px;border:1px solid #e3dfd3;border-radius:13px;background:white;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #315d8c;outline-offset:3px}@media(max-width:460px){.page{width:min(100% - 20px,420px)}header{min-height:58px}.brand{font-size:.78rem}.panel{padding:19px 13px;border-radius:21px}.groups{gap:6px}.group{padding:10px 5px}.things{min-height:94px;gap:4px}.thing{border-radius:7px}.group-label{font-size:.74rem}.versus{font-size:.72rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style></head><body><div class="page"><header><a class="home" href="index.html" aria-label="Back to Yuaan’s Playroom">← <span>Home</span></a><span class="brand">Yuaan’s Playroom</span></header><main><section class="panel"><div class="topline"><p class="eyebrow">Compare the groups</p><span class="round" id="round">Pair 1 of 6</span></div><h1>Which has fewer?</h1><p class="instruction">Count each group. Tap the group that has fewer things.</p><p class="prompt">Tap the group with fewer.</p><div class="groups" id="groups"></div><p class="feedback" id="feedback" aria-live="polite">Look at both groups. Which has fewer?</p><div class="actions"><button class="action" id="hear" type="button">🔊 Hear the question</button><button class="action" id="reset" type="button">Start over</button></div></section></main></div><script>
(()=>{const rounds=[{left:2,right:4,icon:'🍐',name:'pears',fewer:'left'},{left:5,right:3,icon:'🐞',name:'ladybugs',fewer:'right'},{left:1,right:6,icon:'🧁',name:'cupcakes',fewer:'left'},{left:7,right:4,icon:'🦆',name:'ducks',fewer:'right'},{left:3,right:8,icon:'🍓',name:'strawberries',fewer:'left'},{left:9,right:5,icon:'🐚',name:'shells',fewer:'right'}];const groups=document.getElementById('groups'),feedback=document.getElementById('feedback'),roundLabel=document.getElementById('round'),hear=document.getElementById('hear');let index=0,answered=false,timer;let speechFallback;function speak(text,after){clearTimeout(speechFallback);let finished=false;const finish=()=>{if(finished)return;finished=true;clearTimeout(speechFallback);if(after)after()};if(!('speechSynthesis'in window)){finish();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.78;u.pitch=1.08;if(after){u.onend=finish;u.onerror=finish;speechFallback=setTimeout(finish,Math.max(3500,text.length*120))}speechSynthesis.speak(u)}function sayQuestion(){speak('Count each group. Tap the group that has fewer things.')}function render(){clearTimeout(timer);answered=false;hear.disabled=false;const r=rounds[index];roundLabel.textContent=`Pair ${index+1} of ${rounds.length}`;groups.replaceChildren();[['left',r.left],['right',r.right]].forEach(([side,total])=>{const b=document.createElement('button');b.type='button';b.className='group';b.setAttribute('aria-label',`${side==='left'?'Left':'Right'} group with ${total} ${r.name}`);b.addEventListener('click',()=>answer(side));const things=document.createElement('span');things.className='things';for(let n=0;n<total;n++){const thing=document.createElement('span');thing.className='thing';thing.textContent=r.icon;thing.setAttribute('aria-hidden','true');things.append(thing)}const label=document.createElement('span');label.className='group-label';label.textContent=`${side==='left'?'Left':'Right'} group`;b.append(things,label);groups.append(b)});feedback.className='feedback';feedback.textContent='Look at both groups. Which has fewer?'}function answer(side){if(answered)return;const r=rounds[index];if(side!==r.fewer){feedback.className='feedback try';feedback.textContent='Count the groups again. Which side has fewer things?';speak('Count the groups again. Which side has fewer things?');return}answered=true;hear.disabled=true;for(const b of groups.children)b.disabled=true;feedback.className='feedback good';feedback.textContent=`That's right! ${r.fewer==='left'?'The left':'The right'} group has fewer ${r.name}.`;speak(`That's right. The ${r.fewer} group has fewer ${r.name}. Nice comparing, Yuaan!`,()=>{timer=setTimeout(()=>{if(index===rounds.length-1){feedback.textContent='You compared every pair! Great work, Yuaan!';return}index++;render();sayQuestion()},1200)})}document.getElementById('hear').addEventListener('click',sayQuestion);document.getElementById('reset').addEventListener('click',()=>{clearTimeout(timer);if('speechSynthesis'in window)speechSynthesis.cancel();index=0;render();sayQuestion()});render();window.addEventListener('load',()=>setTimeout(sayQuestion,350))})();
</script></body></html>
